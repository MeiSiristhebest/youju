name: 💡 Feature Request / RFC
description: Suggest an idea or propose an architecture RFC
labels: ["enhancement", "rfc"]
body:
  - type: markdown
    attributes:
      value: |
        Please explain the problem you are trying to solve and your proposed architecture.
  - type: textarea
    id: problem
    attributes:
      label: Problem & Motivation
      description: Is your feature request related to a problem? Please describe.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution / RFC Architecture
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false
