---
name: Code Hygiene & Fast Linter

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "youju-app/**"
      - "youju-server/**"
      - "biome.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/code-hygiene.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Fast Biome Check & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enable Corepack & Setup pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Setup Node.js 22.x with pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome Lint & Format Check
        run: pnpm run check

      - name: Fast TypeScript Typecheck
        run: pnpm run typecheck
...
